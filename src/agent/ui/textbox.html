<!doctype html>
<!-- The UI every agent starts with, version 0: a box to type a message in,
     sent through jen.act like any UI's action. It shows nothing of the
     conversation: the agent answers it by publishing a UI of its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jen</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  .box { width: min(40rem, calc(100vw - 2rem)); display: grid; gap: 0.5rem; }
  textarea { font: inherit; padding: 0.75rem; min-height: 6rem; resize: vertical; border-radius: 0.5rem; border: 1px solid GrayText; background: Canvas; color: CanvasText; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  button { font: inherit; padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: 0; background: AccentColor; color: AccentColorText; cursor: pointer; }
  #status { color: GrayText; }
</style>
</head>
<body>
<div class="box">
  <textarea id="message" name="message" placeholder="Message the agent" autofocus></textarea>
  <div class="row">
    <span id="status" role="status"></span>
    <button id="send" type="button">Send</button>
  </div>
</div>
<script>
  const box = document.getElementById("message");
  const status = document.getElementById("status");
  function send() {
    const text = box.value.trim();
    if (text === "") return;
    jen.act(text);
    box.value = "";
    status.textContent = "Sent.";
  }
  // No form: the frame has no allow-forms, and Chromium drops a sandboxed
  // form's submission before its submit event fires.
  document.getElementById("send").addEventListener("click", send);
  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });
  box.addEventListener("input", () => (status.textContent = ""));
</script>
</body>
</html>
