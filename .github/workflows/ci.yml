name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The workspace's boundary on a plain Linux kernel. It needs Docker and no
  # credentials, unlike the other live checks, which CI has no secrets for.
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: docker build --target agent -t jen-agent .
      - run: docker build --target runtime -t jen-runtime .
      - run: docker build --target workspace -t jen-workspace .
      - run: npx vitest run --config vitest.live.config.ts src/runtime/workspace.live.test.ts

  # The UI's sandbox in a real Chromium: a hostile published UI against the
  # agent's page. It needs no model and no Docker.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --config vitest.live.config.ts src/agent/sandbox.live.test.ts
