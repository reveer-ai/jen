name: CI

# `pull_request` covers every change on its way in. `workflow_call` is how the release
# invokes this as a gating job, which is what puts these checks in the release run's own
# dependency chain. There is deliberately no `push: main` — the release covers that branch
# through the called workflow, and a second standalone run would look authoritative while
# racing the release rather than blocking it.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The minimum `engines.node` allows, so nothing newer can slip in unnoticed.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Pack on the floor and let the release promote this exact tarball, so the artifact
      # that ships is the one these checks verified rather than one rebuilt under the
      # newer Node the publish job needs. `npm pack` runs `prepack`, so it is built and
      # staged by construction — and it does not create `--pack-destination`, exiting
      # ENOENT if the directory is absent, which is why it is made first.
      - run: mkdir -p ./.pack && npm pack --pack-destination ./.pack
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./.pack/*.tgz
          if-no-files-found: error
          retention-days: 7
