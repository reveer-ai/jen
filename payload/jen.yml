# jen's pipeline, on a schedule.
#
# This file is jen's. `jen update` rewrites it, so an edit here is lost on the next
# version — including the two values below, which are resolved from `registry.yaml` when
# the file is written. Change the project this polls by editing the registry and running
# `jen update`, never by editing this file.
#
# Every 30 minutes, one tick: poll the tracker, decide what is dispatchable, and run a
# session for each task that passed. The interval is a floor between ticks rather than a
# promise of when a poll happens — a tick waits for the sessions it launched.

name: jen

on:
  schedule:
    # Actions bills a job by the whole minute, so the interval is a spend decision as much
    # as a latency one. At 30 minutes this is ~1,440 job-minutes a month; a task waits at
    # most one interval between stages, against sessions that run for minutes.
    - cron: '*/30 * * * *'
  # So a poll can be asked for without waiting, which is what you reach for after binding
  # the project or after re-enabling a schedule the host disabled.
  workflow_dispatch:

# The pipeline acts under its own registered applications, and the executor overwrites
# `GITHUB_TOKEN` in every session's environment with the installation token that session
# minted. Nothing in this job has any use for the workflow's own credential, so it is
# granted nothing at all.
permissions: {}

# A scheduled tick arriving while one is running waits rather than running beside it, and
# is never cancelled mid-session: `cancel-in-progress: false` is what keeps a stage from
# being killed halfway through by the next poll falling due.
concurrency:
  group: jen-pipeline
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # A liveness bound on the *job*, well below the host's six-hour ceiling. It is not a
    # limit on how long a stage session may take: a session that runs this long is already
    # broken, and this is what stops it holding a runner and blocking the next poll.
    timeout-minutes: 120

    steps:
      # Nothing here clones this repository, and adding a step that does is not a small
      # change. Everything the deciding pass needs arrives as environment or is compiled
      # into the published CLI, so a poll costs the same on a repository of any size. The
      # only clone in the pipeline is the one a stage session makes for itself, taken only
      # when there is work to do.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Latest, so a poll picks up jen's own fixes without a commit here. Pin either of
      # these to a version if you would rather decide when that happens; the skills a
      # session runs come from your repository either way, not from this install.
      - name: Install the pipeline
        run: npm install -g @reveer/jen @anthropic-ai/claude-code

      # One tick. It polls, decides, launches a session per dispatched task, and exits
      # once those sessions have finished — the loop is the schedule above, not the CLI.
      #
      # Until the project is bound, the two values below are empty and this step fails
      # naming the missing team. That is the intended failure: GitHub reports a failed
      # scheduled run to the repository's owner, where a job that quietly skipped would
      # look exactly like a pipeline with nothing to do.
      - name: jen run
        run: jen run
        env:
          JEN_TEAM: "{{jen:team}}"
          JEN_PROJECT: "{{jen:project}}"
          JEN_REPO: ${{ github.repository }}

          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

          # Model access, under either name it is accepted as. Both are passed through
          # unconditionally: a secret this repository was never given expands to an empty
          # value, which jen reads as absent, so an adopter who stored one has stored one.
          # Storing both is refused rather than resolved — the run names both and stops.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # One application per role, so the pull request a stage opens, the review it
          # submits, and the merge it makes are three identities in the timeline rather
          # than one. A session is handed only its own role's, and never another's.
          JEN_GH_APP_ID_DESIGN: ${{ secrets.JEN_GH_APP_ID_DESIGN }}
          JEN_GH_INSTALLATION_DESIGN: ${{ secrets.JEN_GH_INSTALLATION_DESIGN }}
          JEN_GH_PRIVATE_KEY_DESIGN: ${{ secrets.JEN_GH_PRIVATE_KEY_DESIGN }}

          JEN_GH_APP_ID_DEV: ${{ secrets.JEN_GH_APP_ID_DEV }}
          JEN_GH_INSTALLATION_DEV: ${{ secrets.JEN_GH_INSTALLATION_DEV }}
          JEN_GH_PRIVATE_KEY_DEV: ${{ secrets.JEN_GH_PRIVATE_KEY_DEV }}

          JEN_GH_APP_ID_DELIVER: ${{ secrets.JEN_GH_APP_ID_DELIVER }}
          JEN_GH_INSTALLATION_DELIVER: ${{ secrets.JEN_GH_INSTALLATION_DELIVER }}
          JEN_GH_PRIVATE_KEY_DELIVER: ${{ secrets.JEN_GH_PRIVATE_KEY_DELIVER }}
